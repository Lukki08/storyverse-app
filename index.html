
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100b1c">
<title>StoryVerse</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100b1c;color:#f6f0ff;font-family:Arial,sans-serif}
header{padding:23px 18px;background:linear-gradient(135deg,#32185b,#171027);border-bottom:1px solid #493267}
.logo{font-size:27px;font-weight:bold}
header p{color:#c3b2dc;margin-bottom:0}
main{max-width:900px;margin:auto;padding:22px 16px}
button{border:0;border-radius:10px;padding:12px 15px;background:#8050cf;color:white;font-weight:bold;font-size:14px;cursor:pointer}
button.alt{background:#30233f}
button.danger{background:#713344}
input,textarea,select{width:100%;padding:13px;margin:7px 0 15px;background:#21192e;color:white;border:1px solid #59436e;border-radius:10px;font-size:15px}
textarea{resize:vertical}
label{font-size:13px;color:#d4c5e8}
.card{background:#21192f;border:1px solid #49345f;border-radius:14px;padding:16px;margin:12px 0}
.card h3{margin:0 0 8px}
.muted{color:#b7a7ca;font-size:13px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hidden{display:none!important}
.back{background:transparent;color:#d7c4f3;padding-left:0}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:10px 0;margin:12px 0}
.tabs button{white-space:nowrap;background:#30233f}
.tabs button.active{background:#8050cf}
.panel{background:#1b1427;border:1px solid #49345f;border-radius:14px;padding:16px;margin-top:12px}
.empty{text-align:center;color:#b7a7ca;padding:28px 8px}
.small{font-size:12px;color:#a997bd}
footer{text-align:center;color:#857596;padding:28px 10px;font-size:12px}
hr{border:0;border-top:1px solid #443451;margin:18px 0}
.item-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.item-actions button{font-size:12px;padding:9px 11px}
</style>
</head>
<body>
<header>
<div class="logo">🌌 StoryVerse</div>
<p>Seu universo. Suas histórias. Sua imaginação.</p>
</header>
<main>
<section id="home">
<h2>📚 Minha biblioteca</h2>
<p class="muted">Todas as suas histórias em um só lugar.</p>
<div class="actions">
<button onclick="newStory()">＋ Nova história</button>
<button class="alt" onclick="exportData()">Exportar backup</button>
<button class="alt" onclick="document.getElementById('importFile').click()">Importar backup</button>
<input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importData(event)">
</div>
<label>Pesquisar histórias</label>
<input id="search" placeholder="Buscar pelo título..." oninput="renderHome()">
<div id="storyList"></div>
</section>

<section id="workspace" class="hidden">
<button class="back" onclick="goHome()">← Voltar à biblioteca</button>
<div class="row">
<div>
<h2 id="storyTitle"></h2>
<div id="storyMeta" class="muted"></div>
</div>
<button class="alt" onclick="editStory()">Editar história</button>
</div>
<div class="tabs">
<button id="tab-overview" onclick="tab('overview')">Visão geral</button>
<button id="tab-characters" onclick="tab('characters')">Personagens</button>
<button id="tab-seasons" onclick="tab('seasons')">Temporadas</button>
<button id="tab-memory" onclick="tab('memory')">Memória</button>
</div>
<div id="overview" class="panel"></div>
<div id="characters" class="panel hidden"></div>
<div id="seasons" class="panel hidden"></div>
<div id="memory" class="panel hidden"></div>
</section>
</main>
<footer>StoryVerse • Crie mundos, conte histórias.</footer>

<script>
const KEY="storyverse_v2";
let stories=JSON.parse(localStorage.getItem(KEY)||"[]");
let current=null;
let activeTab="overview";

function save(){localStorage.setItem(KEY,JSON.stringify(stories))}
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function getCurrent(){return stories.find(s=>s.id===current)}
function newStory(){
let title=prompt("Nome da nova história:");
if(!title||!title.trim())return;
let genre=prompt("Gênero da história:")||"Não definido";
let description=prompt("Breve descrição da história:")||"";
let s={id:Date.now(),title:title.trim(),genre,description,characters:[],seasons:[],memory:"",created:new Date().toLocaleDateString("pt-BR")};
stories.unshift(s);save();openStory(s.id)
}
function renderHome(){
let q=(document.getElementById("search").value||"").toLowerCase();
let list=stories.filter(s=>s.title.toLowerCase().includes(q));
let el=document.getElementById("storyList");
if(!list.length){el.innerHTML='<div class="empty">📖<br><br>Nenhuma história encontrada.<br>Crie sua primeira aventura!</div>';return}
el.innerHTML=list.map(s=>`
<div class="card">
<h3>📘 ${esc(s.title)}</h3>
<div class="muted">${esc(s.genre)} • Criada em ${esc(s.created)}</div>
<p>${esc(s.description||"Sem descrição.")}</p>
<div class="small">${s.characters.length} personagem(ns) • ${s.seasons.length} temporada(s)</div>
<div class="actions">
<button onclick="openStory(${s.id})">Abrir história →</button>
<button class="danger" onclick="deleteStory(${s.id})">Excluir</button>
</div></div>`).join("");
}
function deleteStory(id){
if(!confirm("Excluir esta história e todo o seu conteúdo?"))return;
stories=stories.filter(s=>s.id!==id);save();renderHome()
}
function openStory(id){
current=id;activeTab="overview";
document.getElementById("home").classList.add("hidden");
document.getElementById("workspace").classList.remove("hidden");
renderWorkspace()
}
function goHome(){
current=null;
document.getElementById("workspace").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
renderHome()
}
function editStory(){
let s=getCurrent();if(!s)return;
let title=prompt("Título:",s.title);if(title===null)return;
let genre=prompt("Gênero:",s.genre);if(genre===null)return;
let desc=prompt("Descrição:",s.description);if(desc===null)return;
s.title=title.trim()||s.title;s.genre=genre;s.description=desc;save();renderWorkspace()
}
function tab(name){
activeTab=name;
["overview","characters","seasons","memory"].forEach(t=>{
document.getElementById(t).classList.toggle("hidden",t!==name);
document.getElementById("tab-"+t).classList.toggle("active",t===name)
});
renderWorkspace()
}
function renderWorkspace(){
let s=getCurrent();if(!s)return;
document.getElementById("storyTitle").textContent="📖 "+s.title;
document.getElementById("storyMeta").textContent=s.genre+" • "+s.created;
document.getElementById("overview").innerHTML=`
<h3>Sobre esta história</h3>
<p>${esc(s.description||"Adicione uma descrição para este universo.")}</p>
<hr>
<div class="row"><span>👥 Personagens</span><b>${s.characters.length}</b></div>
<div class="row"><span>🎬 Temporadas</span><b>${s.seasons.length}</b></div>
<div class="row"><span>📄 Episódios</span><b>${s.seasons.reduce((n,x)=>n+x.episodes.length,0)}</b></div>
<hr><p class="muted">Este espaço pertence exclusivamente a esta história.</p>`;
renderCharacters(s);renderSeasons(s);renderMemory(s);
["overview","characters","seasons","memory"].forEach(t=>{
document.getElementById(t).classList.toggle("hidden",t!==activeTab);
document.getElementById("tab-"+t).classList.toggle("active",t===activeTab)
})
}
function renderCharacters(s){
let el=document.getElementById("characters");
el.innerHTML=`<div class="row"><h3>👥 Personagens</h3><button onclick="addCharacter()">＋ Novo personagem</button></div>`;
if(!s.characters.length){el.innerHTML+='<div class="empty">Nenhum personagem cadastrado ainda.</div>';return}
el.innerHTML+=s.characters.map(c=>`
<div class="card"><h3>${esc(c.name)}</h3>
<div class="muted">${esc(c.role||"Papel não definido")}</div>
<p>${esc(c.personality||"")}</p>
<p class="small">${esc(c.details||"")}</p>
<div class="item-actions">
<button class="alt" onclick="editCharacter(${c.id})">Editar</button>
<button class="danger" onclick="removeCharacter(${c.id})">Excluir</button>
</div></div>`).join("")
}
function addCharacter(){
let s=getCurrent();
let name=prompt("Nome do personagem:");if(!name||!name.trim())return;
let role=prompt("Papel na história:")||"";
let personality=prompt("Personalidade:")||"";
let details=prompt("Aparência, passado e outros detalhes:")||"";
s.characters.push({id:Date.now(),name,role,personality,details});save();renderWorkspace()
}
function editCharacter(id){
let s=getCurrent(),c=s.characters.find(x=>x.id===id);if(!c)return;
let v=prompt("Nome:",c.name);if(v===null)return;c.name=v;
v=prompt("Papel:",c.role);if(v!==null)c.role=v;
v=prompt("Personalidade:",c.personality);if(v!==null)c.personality=v;
v=prompt("Outros detalhes:",c.details);if(v!==null)c.details=v;
save();renderWorkspace()
}
function removeCharacter(id){
if(!confirm("Excluir este personagem?"))return;
let s=getCurrent();s.characters=s.characters.filter(c=>c.id!==id);save();renderWorkspace()
}
function renderSeasons(s){
let el=document.getElementById("seasons");
el.innerHTML=`<div class="row"><h3>🎬 Temporadas</h3><button onclick="addSeason()">＋ Nova temporada</button></div>`;
if(!s.seasons.length){el.innerHTML+='<div class="empty">Nenhuma temporada criada ainda.</div>';return}
el.innerHTML+=s.seasons.map(se=>`
<div class="card"><h3>${esc(se.title)}</h3>
<p class="muted">${se.episodes.length} episódio(s)</p>
<div class="item-actions">
<button onclick="addEpisode(${se.id})">＋ Novo episódio</button>
<button class="alt" onclick="renameSeason(${se.id})">Renomear</button>
<button class="danger" onclick="removeSeason(${se.id})">Excluir</button>
</div>
${se.episodes.map(ep=>`
<div class="panel"><b>${esc(ep.title)}</b>
<p>${esc(ep.summary)}</p>
<div class="item-actions">
<button class="alt" onclick="editEpisode(${se.id},${ep.id})">Abrir / editar</button>
<button class="danger" onclick="removeEpisode(${se.id},${ep.id})">Excluir</button>
</div></div>`).join("")}
</div>`).join("")
}
function addSeason(){
let s=getCurrent(),title=prompt("Nome da temporada:");
if(!title||!title.trim())return;
s.seasons.push({id:Date.now(),title,episodes:[]});save();renderWorkspace()
}
function renameSeason(id){
let s=getCurrent(),se=s.seasons.find(x=>x.id===id);if(!se)return;
let v=prompt("Nome da temporada:",se.title);if(v===null||!v.trim())return;
se.title=v;save();renderWorkspace()
}
function removeSeason(id){
if(!confirm("Excluir esta temporada e seus episódios?"))return;
let s=getCurrent();s.seasons=s.seasons.filter(x=>x.id!==id);save();renderWorkspace()
}
function addEpisode(seasonId){
let s=getCurrent(),se=s.seasons.find(x=>x.id===seasonId);
let title=prompt("Título do episódio:");if(!title||!title.trim())return;
let summary=prompt("Sinopse:")||"";
let content=prompt("Anotações ou conteúdo inicial:")||"";
se.episodes.push({id:Date.now(),title,summary,content});save();renderWorkspace()
}
function editEpisode(seasonId,episodeId){
let s=getCurrent(),se=s.seasons.find(x=>x.id===seasonId),ep=se.episodes.find(x=>x.id===episodeId);
let v=prompt("Título:",ep.title);if(v===null)return;ep.title=v;
v=prompt("Sinopse:",ep.summary);if(v!==null)ep.summary=v;
v=prompt("Conteúdo / anotações:",ep.content);if(v!==null)ep.content=v;
save();renderWorkspace()
}
function removeEpisode(seasonId,episodeId){
if(!confirm("Excluir este episódio?"))return;
let s=getCurrent(),se=s.seasons.find(x=>x.id===seasonId);
se.episodes=se.episodes.filter(x=>x.id!==episodeId);save();renderWorkspace()
}
function renderMemory(s){
document.getElementById("memory").innerHTML=`
<h3>🧠 Memória narrativa</h3>
<p class="muted">Registre acontecimentos, informações importantes, cronologia, relações e pontas pendentes desta história.</p>
<textarea id="memoryText" rows="12" placeholder="Escreva aqui os acontecimentos e detalhes que precisam ser lembrados...">${esc(s.memory)}</textarea>
<button onclick="saveMemory()">Salvar memória</button>
<p class="small">A memória é independente para cada história.</p>`
}
function saveMemory(){
let s=getCurrent();s.memory=document.getElementById("memoryText").value;save();
alert("Memória narrativa salva!")
}
function exportData(){
let blob=new Blob([JSON.stringify(stories,null,2)],{type:"application/json"});
let url=URL.createObjectURL(blob),a=document.createElement("a");
a.href=url;a.download="storyverse-backup.json";a.click();URL.revokeObjectURL(url)
}
function importData(event){
let file=event.target.files[0];if(!file)return;
let reader=new FileReader();
reader.onload=()=>{
try{
let data=JSON.parse(reader.result);
if(!Array.isArray(data))throw Error();
if(!confirm("Importar backup? As histórias atuais serão substituídas."))return;
stories=data;save();renderHome();alert("Backup importado!")
}catch(e){alert("Arquivo de backup inválido.")}
};
reader.readAsText(file);event.target.value=""
}
renderHome();
</script>
</body>
</html>
