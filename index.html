
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100d1c">
<title>StoryVerse</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100d1c;color:#f5f1ff;font-family:Arial,sans-serif}
header{padding:28px 20px;background:linear-gradient(135deg,#29164b,#17112b);border-bottom:1px solid #49336a}
.logo{font-size:27px;font-weight:bold;letter-spacing:1px}
header p{color:#c5b6df;margin-bottom:0}
main{max-width:850px;margin:auto;padding:24px 18px}
h2{font-size:21px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
button{background:#8053cf;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}
button.secondary{background:#302443}
input,textarea{width:100%;padding:13px;background:#211a30;border:1px solid #514064;border-radius:10px;color:white;font-size:16px;margin:7px 0 14px}
label{color:#d5c7ed;font-size:14px}
.card{background:#20192e;border:1px solid #49365e;border-radius:14px;padding:17px;margin:12px 0}
.card h3{margin:0 0 8px}
.card p{color:#c5b9d6;white-space:pre-wrap}
.small{font-size:12px;color:#a99abf}
#form{display:none;background:#1b1528;padding:18px;border:1px solid #594273;border-radius:14px;margin:18px 0}
.empty{text-align:center;color:#b8a9cc;padding:35px 10px}
footer{text-align:center;color:#8e80a5;padding:30px;font-size:12px}
</style>
</head>
<body>
<header>
<div class="logo">🌌 StoryVerse</div>
<p>Seu universo. Suas histórias. Sua imaginação.</p>
</header>
<main>
<h2>📚 Minha biblioteca</h2>
<p class="small">Organize suas ideias e crie seus próprios universos.</p>
<div class="actions">
<button onclick="showForm()">＋ Nova história</button>
<button class="secondary" onclick="exportData()">Exportar biblioteca</button>
</div>
<div id="form">
<h2>Nova história</h2>
<label>Nome da história</label>
<input id="name" placeholder="Digite o título">
<label>Gênero</label>
<input id="genre" placeholder="Fantasia, aventura, mistério...">
<label>Descrição</label>
<textarea id="description" rows="4" placeholder="Sobre o que é sua história?"></textarea>
<div class="actions">
<button onclick="saveStory()">Salvar história</button>
<button class="secondary" onclick="hideForm()">Cancelar</button>
</div>
</div>
<label>Pesquisar histórias</label>
<input id="search" placeholder="Buscar pelo título..." oninput="render()">
<div id="stories"></div>
</main>
<footer>StoryVerse • Sua criatividade não tem limites.</footer>
<script>
let stories=JSON.parse(localStorage.getItem("storyverse_stories")||"[]");
function store(){localStorage.setItem("storyverse_stories",JSON.stringify(stories))}
function showForm(){document.getElementById("form").style.display="block";document.getElementById("name").focus()}
function hideForm(){document.getElementById("form").style.display="none"}
function saveStory(){
let name=document.getElementById("name").value.trim();
if(!name){alert("Digite o nome da história.");return}
stories.unshift({id:Date.now(),name,genre:document.getElementById("genre").value,description:document.getElementById("description").value,date:new Date().toLocaleDateString("pt-BR")});
store();
["name","genre","description"].forEach(id=>document.getElementById(id).value="");
hideForm();render()
}
function removeStory(id){
if(confirm("Deseja excluir esta história?")){
stories=stories.filter(s=>s.id!==id);store();render()
}}
function render(){
let q=document.getElementById("search").value.toLowerCase();
let list=stories.filter(s=>s.name.toLowerCase().includes(q));
let area=document.getElementById("stories");
if(!list.length){area.innerHTML='<div class="empty">📖<br><br>Nenhuma história encontrada.<br>Que tal criar sua primeira aventura?</div>';return}
area.innerHTML=list.map(s=>`<article class="card"><h3>📘 ${escapeHTML(s.name)}</h3><div class="small">${escapeHTML(s.genre||"Sem gênero definido")} • ${s.date}</div><p>${escapeHTML(s.description||"Sem descrição.")}</p><button class="secondary" onclick="removeStory(${s.id})">Excluir</button></article>`).join("")
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function exportData(){
let file=new Blob([JSON.stringify(stories,null,2)],{type:"application/json"});
let url=URL.createObjectURL(file);
let a=document.createElement("a");a.href=url;a.download="storyverse-backup.json";a.click();URL.revokeObjectURL(url)
}
render();
</script>
</body>
</html>
